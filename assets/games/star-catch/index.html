<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Catch</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #1e3a8a 0, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
    }
    #wrap { position: relative; width: min(960px, 100vw); height: min(600px, 100vh); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.04em;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }
    #hud b { color: #7dd3fc; font-variant-numeric: tabular-nums; }
    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 0.8rem;
      padding: 2rem;
      text-align: center;
      background: #020617cc;
      backdrop-filter: blur(4px);
    }
    #overlay[hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -0.03em; }
    p { max-width: 32rem; margin: 0; color: #bae6fd; line-height: 1.5; }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem 1.6rem;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #04121f;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px #38bdf855;
    }
    button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
    small { color: #94a3b8; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Star Catch game area"></canvas>
    <div id="hud">
      <span>Score <b id="score">0</b></span>
      <span>Time <b id="time">30</b>s</span>
      <span>Goal <b>20</b></span>
    </div>
    <div id="overlay">
      <h1>Star Catch</h1>
      <p id="message">Catch falling stars with the paddle. Move with your mouse, finger, or the &larr; / &rarr; keys. Reach 20 before time runs out!</p>
      <button id="start" type="button">Start game</button>
      <small>30-second round · no downloads · works on touch screens</small>
    </div>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const overlay = document.getElementById('overlay');
      const message = document.getElementById('message');
      const startButton = document.getElementById('start');

      const GAME_SECONDS = 30;
      const GOAL = 20;
      const paddle = { x: 0, y: 0, width: 110, height: 16 };
      const keys = { left: false, right: false };
      let width = 960;
      let height = 600;
      let score = 0;
      let timeLeft = GAME_SECONDS;
      let running = false;
      let lastFrame = 0;
      let spawnTimer = 0;
      let stars = [];
      let sparks = [];

      function send(event, metadata) {
        const payload = { source: 'gameportal', event };
        if (metadata !== undefined) Object.assign(payload, metadata);
        try { parent.postMessage(payload, '*'); } catch (_) { /* no parent */ }
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        paddle.width = Math.min(130, Math.max(78, width * 0.14));
        paddle.y = height - 34;
        if (paddle.x === 0) paddle.x = (width - paddle.width) / 2;
        paddle.x = Math.min(Math.max(paddle.x, 0), width - paddle.width);
      }

      function reset() {
        score = 0;
        timeLeft = GAME_SECONDS;
        spawnTimer = 0;
        stars = [];
        sparks = [];
        paddle.x = (width - paddle.width) / 2;
        scoreEl.textContent = '0';
        timeEl.textContent = String(GAME_SECONDS);
      }

      function start() {
        reset();
        running = true;
        overlay.hidden = true;
        lastFrame = performance.now();
        send('start', { metadata: {} });
        canvas.focus();
      }

      function finish(won) {
        running = false;
        message.textContent = won
          ? `You caught ${score} stars — goal reached! Want another round?`
          : `Time! You caught ${score} of ${GOAL} stars. Try again?`;
        startButton.textContent = 'Play again';
        overlay.hidden = false;
        send('end', { metadata: { score, won, duration_seconds: GAME_SECONDS } });
      }

      function spawnStar() {
        const radius = 8 + Math.random() * 8;
        stars.push({
          x: radius + Math.random() * (width - radius * 2),
          y: -radius,
          radius,
          speed: 170 + Math.random() * 150 + (GAME_SECONDS - timeLeft) * 4,
          hue: 190 + Math.random() * 45,
        });
      }

      function burst(x, y, hue) {
        for (let i = 0; i < 8; i += 1) {
          const angle = (Math.PI * 2 * i) / 8;
          sparks.push({ x, y, vx: Math.cos(angle) * 90, vy: Math.sin(angle) * 90, life: 0.45, hue });
        }
      }

      function drawBackground() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(148, 163, 184, 0.18)';
        for (let i = 0; i < 40; i += 1) {
          const x = ((i * 137.5) % width);
          const y = ((i * 89.3) % height);
          ctx.fillRect(x, y, 1.5, 1.5);
        }
      }

      function drawPaddle() {
        const gradient = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.width, 0);
        gradient.addColorStop(0, '#0ea5e9');
        gradient.addColorStop(0.5, '#e0f2fe');
        gradient.addColorStop(1, '#2563eb');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 9);
        ctx.fill();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function drawStar(star) {
        ctx.save();
        ctx.translate(star.x, star.y);
        ctx.shadowColor = `hsl(${star.hue} 90% 65%)`;
        ctx.shadowBlur = 18;
        ctx.fillStyle = `hsl(${star.hue} 95% 78%)`;
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const r = i % 2 === 0 ? star.radius : star.radius * 0.45;
          const angle = (Math.PI * i) / 5 - Math.PI / 2;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        drawBackground();

        if (running) {
          if (keys.left) paddle.x -= 460 * dt;
          if (keys.right) paddle.x += 460 * dt;
          paddle.x = Math.min(Math.max(paddle.x, 0), width - paddle.width);

          timeLeft = Math.max(0, timeLeft - dt);
          timeEl.textContent = String(Math.ceil(timeLeft));
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnStar();
            spawnTimer = 0.72 - Math.min(0.35, (GAME_SECONDS - timeLeft) * 0.012);
          }

          for (let i = stars.length - 1; i >= 0; i -= 1) {
            const star = stars[i];
            star.y += star.speed * dt;
            drawStar(star);
            const caught = star.y + star.radius >= paddle.y
              && star.y - star.radius <= paddle.y + paddle.height
              && star.x >= paddle.x - star.radius
              && star.x <= paddle.x + paddle.width + star.radius;
            if (caught) {
              score += 1;
              scoreEl.textContent = String(score);
              burst(star.x, paddle.y, star.hue);
              stars.splice(i, 1);
              send('score', { score });
              if (score >= GOAL) { finish(true); break; }
            } else if (star.y - star.radius > height) {
              stars.splice(i, 1);
            }
          }
        } else {
          for (const star of stars) drawStar(star);
        }

        for (let i = sparks.length - 1; i >= 0; i -= 1) {
          const spark = sparks[i];
          spark.life -= dt;
          if (spark.life <= 0) { sparks.splice(i, 1); continue; }
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          ctx.globalAlpha = Math.max(0, spark.life / 0.45);
          ctx.fillStyle = `hsl(${spark.hue} 90% 70%)`;
          ctx.fillRect(spark.x, spark.y, 3, 3);
          ctx.globalAlpha = 1;
        }

        drawPaddle();

        if (running && timeLeft <= 0) finish(false);
        requestAnimationFrame(frame);
      }

      startButton.addEventListener('click', start);
      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        paddle.x = event.clientX - rect.left - paddle.width / 2;
      });
      canvas.addEventListener('pointerdown', (event) => {
        const rect = canvas.getBoundingClientRect();
        paddle.x = event.clientX - rect.left - paddle.width / 2;
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') { keys.left = true; event.preventDefault(); }
        if (event.key === 'ArrowRight') { keys.right = true; event.preventDefault(); }
        if (event.key === 'Enter' && !running) start();
      });
      window.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft') keys.left = false;
        if (event.key === 'ArrowRight') keys.right = false;
      });
      window.addEventListener('resize', resize);

      resize();
      reset();
      send('ready');
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
