# Production template for the isolated game host (games.example.com).
# Fronts the Laravel /g/* route with caching. Do not set cookies here.
server {
    listen 443 ssl http2;
    server_name games.example.com;

    ssl_certificate     /etc/ssl/certs/games.example.com.crt;
    ssl_certificate_key /etc/ssl/private/games.example.com.key;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location = /g/ {
        return 404;
    }

    location /g/ {
        proxy_pass http://api:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        proxy_cache game_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /health {
        proxy_pass http://api:8400/api/health;
        access_log off;
    }
}

proxy_cache_path /var/cache/nginx/game levels=1:2 keys_zone=game_cache:20m inactive=7d max_size=10g;
