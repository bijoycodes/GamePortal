services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gameplatform
      POSTGRES_USER: gameportal
      POSTGRES_PASSWORD: gameportal_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameportal -d gameplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    working_dir: /var/www/html
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      APP_ENV: local
    ports:
      - "8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/var/www/html

  game:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    working_dir: /var/www/html
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      APP_ENV: local
    ports:
      - "8401:8401"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8401

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    working_dir: /app
    env_file:
      - ../frontend/.env.local
    environment:
      API_URL: http://api:8400
      NEXT_PUBLIC_API_URL: http://localhost:8400
    ports:
      - "4300:4300"
    depends_on:
      - api
    volumes:
      - ../frontend:/app
      - /app/node_modules

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    working_dir: /var/www/html
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/var/www/html
    command: php artisan queue:work --tries=3 --backoff=10

volumes:
  pgdata:
